<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Metin Notu</title>
  <style>
    :root { --bg: #fff; --text: #000; --border: #e5e7eb; }
    body { font-family: system-ui; background: var(--bg); color: var(--text); margin: 0; }
    .header { padding: 16px 24px; border-bottom: 1px solid var(--border); }
    .note-title { font-size: 24px; width: 100%; outline: none; border: none; }
    .note-content { padding: 24px; line-height: 1.6; }
    .note-content[contenteditable] { min-height: 80vh; }
  </style>
</head>
<body>
  <div class="header">
    <div class="note-title" contenteditable="true">Başlıksız Not</div>
  </div>
  <div class="note-content" contenteditable="true">Buraya yazmaya başlayın...</div>

  <div class="header">
  <div class="note-title" contenteditable="true">Başlıksız Not</div>
  <button id="lockBtn" style="margin-left: auto; padding: 6px 12px; background: #e5e7eb; border: none; border-radius: 4px; cursor: pointer;">
    🔒 Kilitli
  </button>
</div>

  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const noteId = urlParams.get('id');
    if (!noteId) { window.location.href = '../index.html'; }

    const API_BASE = 'http://127.0.0.1:5000';

    async function loadNote() {
      const res = await fetch(`${API_BASE}/notes/${noteId}`);
      const note = await res.json();
      document.querySelector('.note-title').textContent = note.title;
      document.querySelector('.note-content').innerHTML = note.content;
    }

    async function saveNote() {
      const title = document.querySelector('.note-title').textContent;
      const content = document.querySelector('.note-content').innerHTML;
      await fetch(`${API_BASE}/notes/${noteId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
      });
    }

    };

    document.querySelector('.note-title').addEventListener('input', debouncedSave);
    document.querySelector('.note-content').addEventListener('input', debouncedSave);

    loadNote();
  </script>
</body>
</html>
