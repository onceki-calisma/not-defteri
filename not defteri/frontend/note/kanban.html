<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kanban Panosu</title>
  <style>
    :root { --bg: #fff; --text: #000; --border: #e5e7eb; }
    body { font-family: system-ui; background: var(--bg); color: var(--text); margin: 0; }
    .header { padding: 16px 24px; border-bottom: 1px solid var(--border); }
    .note-title { font-size: 24px; width: 100%; outline: none; border: none; }
    .kanban-board { display: flex; gap: 24px; padding: 24px; overflow-x: auto; }
    .column { background: #f9fafb; border-radius: 8px; width: 280px; flex-shrink: 0; }
    .column-header { padding: 12px; font-weight: bold; border-bottom: 1px solid var(--border); }
    .cards { padding: 12px; min-height: 300px; }
    .card { background: white; padding: 12px; margin-bottom: 12px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .btn-add { padding: 6px 12px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="note-title" contenteditable="true">Başlıksız Kanban</div>
  </div>
  <div class="kanban-board" id="kanbanBoard">
    <!-- Sütunlar burada oluşturulacak -->
  </div>
  <!-- header içine -->
   <button id="publicBtn" style="margin-left: auto; padding: 6px 12px; background: #e5e7eb; border: none; border-radius: 4px; cursor: pointer;">
   🌍 Açık Kayıt
  </button>

  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const noteId = urlParams.get('id');
    if (!noteId) { window.location.href = '../index.html'; }

    const API_BASE = 'http://127.0.0.1:5000';
    let boardData = { columns: ["Yapılacak", "Devam Ediyor", "Tamamlandı"], cards: [] };

    async function loadNote() {
      const res = await fetch(`${API_BASE}/notes/${noteId}`);
      const note = await res.json();
      document.querySelector('.note-title').textContent = note.title;
      try {
        boardData = JSON.parse(note.content || JSON.stringify(boardData));
      } catch (e) {
        boardData = { columns: ["Yapılacak", "Devam Ediyor", "Tamamlandı"], cards: [] };
      }
      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('kanbanBoard');
      board.innerHTML = boardData.columns.map((col, colIndex) => `
        <div class="column">
          <div class="column-header">${col}</div>
          <div class="cards" data-col="${colIndex}">
            ${boardData.cards
              .filter(card => card.column === colIndex)
              .map((card, i) => `<div class="card" data-card="${card.id}">${card.text}</div>`)
              .join('')}
            <button class="btn-add" data-col="${colIndex}">+ Kart Ekle</button>
          </div>
        </div>
      `).join('');

      // Kart ekleme
      board.querySelectorAll('.btn-add').forEach(btn => {
        btn.addEventListener('click', () => {
          const colIndex = parseInt(btn.dataset.col);
          const newCard = { id: Date.now(), text: 'Yeni kart', column: colIndex };
          boardData.cards.push(newCard);
          saveBoard();
        });
      });
    }

    async function saveBoard() {
      const title = document.querySelector('.note-title').textContent;
      await fetch(`${API_BASE}/notes/${noteId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content: JSON.stringify(boardData) })
      });
    }

    loadNote();
  </script>
</body>
</html>
