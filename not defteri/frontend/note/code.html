<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kod Notu</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <style>
    :root { --bg: #fff; --text: #000; --border: #e5e7eb; }
    body { font-family: system-ui; background: var(--bg); color: var(--text); margin: 0; }
    .header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
    .note-title { font-size: 24px; width: 100%; outline: none; border: none; }
    .language-select { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; }
    .code-container { padding: 24px; }
    #codeEditor { width: 100%; height: 80vh; font-family: monospace; font-size: 14px; padding: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="note-title" contenteditable="true">Başlıksız Kod</div>
    <select class="language-select" id="langSelect">
      <option value="python">Python</option>
      <option value="javascript">JavaScript</option>
      <option value="html">HTML</option>
      <option value="css">CSS</option>
    </select>
  </div>
  <div class="code-container">
    <textarea id="codeEditor"># Kodunuzu buraya yazın</textarea>
  </div>
  <!-- header içine -->
  <button id="publicBtn" style="margin-left: auto; padding: 6px 12px; background: #e5e7eb; border: none; border-radius: 4px; cursor: pointer;">
    🌍 Açık Kayıt
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const noteId = urlParams.get('id');
    if (!noteId) { window.location.href = '../index.html'; }

    const API_BASE = 'http://127.0.0.1:5000';

    async function loadNote() {
      const res = await fetch(`${API_BASE}/notes/${noteId}`);
      const note = await res.json();
      document.querySelector('.note-title').textContent = note.title;
      document.getElementById('codeEditor').value = note.content;
    }

    async function saveNote() {
      const title = document.querySelector('.note-title').textContent;
      const content = document.getElementById('codeEditor').value;
      await fetch(`${API_BASE}/notes/${noteId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
      });
    }

    let saveTimeout;
    const debouncedSave = () => {
      clearTimeout(saveTimeout);

    };

    document.getElementById('codeEditor').addEventListener('input', debouncedSave);
    document.querySelector('.note-title').addEventListener('input', debouncedSave);

    loadNote();
  </script>
</body>
</html>
