<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📓 Not Defteri</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --text: #000000;
      --border: #E5E7EB;
      --hover-bg: #F9FAFB;
      --accent: #2563EB;
      --danger: #EF4444;
      --success: #10B981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 280px;
      padding: 24px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .btn-new {
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 24px;
      width: 100%;
    }

    .notes-list {
      list-style: none;
      flex: 1;
      overflow-y: auto;
    }

    .note-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-item:hover {
      background: var(--hover-bg);
    }

    .note-info {
      flex: 1;
      min-width: 0;
      padding-right: 8px;
    }

    .note-title {
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-type {
      font-size: 12px;
      color: #6B7280;
    }

    .note-icons {
      display: flex;
      gap: 6px;
      margin-left: 8px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 16px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 8px;
      width: 320px;
    }

    .modal-content h3 {
      margin-bottom: 16px;
    }

    .page-type-option {
      display: flex;
      align-items: center;
      padding: 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    .page-type-option:hover {
      background: var(--hover-bg);
    }

    .delete-all {
      margin-top: 16px;
      padding: 8px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }

    .public-icon {
      color: var(--success);
    }

    .locked-icon {
      color: #9CA3AF;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <button class="btn-new" id="newNoteBtn">+ Yeni Not</button>
    <ul class="notes-list" id="notesList">
      <!-- Notlar burada listelenecek -->
    </ul>
    <button class="delete-all" id="deleteAllBtn">🗑️ Tüm Notları Sil</button>
  </div>

  <!-- Yeni Not Türü Seçim Modalı -->
  <div class="modal" id="newNoteModal">
    <div class="modal-content">
      <h3>Yeni Not Oluştur</h3>
      <div class="page-type-option" data-type="text">📝 Metin Notu</div>
      <div class="page-type-option" data-type="code">💻 Kod Notu</div>
      <div class="page-type-option" data-type="task">✅ Görev Listesi</div>
      <div class="page-type-option" data-type="kanban">🗂️ Kanban Panosu</div>
      <div class="page-type-option" data-type="video">🎥 Video Notu</div>
      <div class="page-type-option" data-type="audio">🎙️ Ses Notu</div>
      <div class="page-type-option" data-type="mindmap">🧠 Zihin Haritası</div>
      <div class="page-type-option" data-type="diagram">📐 Şema / Akış Çizimi</div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://127.0.0.1:5000';

    async function apiRequest(url, options = {}) {
      const config = {
        headers: { 'Content-Type': 'application/json' },
        ...options
      };
      const res = await fetch(`${API_BASE}${url}`, config);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function loadNotes() {
      try {
        const notes = await apiRequest('/notes');
        const list = document.getElementById('notesList');
        list.innerHTML = notes.map(note => {
          const isLocked = note.locked;
          const isPublic = note.public;
          return `
            <li class="note-item" data-id="${note.id}" data-type="${note.type}">
              <div class="note-info">
                <div class="note-title">
                  ${note.title}
                  <span class="note-icons">
                    ${isLocked ? '<span class="locked-icon">🔒</span>' : ''}
                    ${isPublic ? '<span class="public-icon">🌍</span>' : ''}
                  </span>
                </div>
                <div class="note-type">${note.type}</div>
              </div>
              ${isLocked ? '' : `<button class="delete-btn" data-id="${note.id}">🗑️</button>`}
            </li>
          `;
        }).join('');

        // Notlara tıklama (silme butonu hariç)
        document.querySelectorAll('.note-item').forEach(item => {
          item.addEventListener('click', (e) => {
            if (e.target.closest('.delete-btn')) return;
            const id = item.dataset.id;
            const type = item.dataset.type;
            window.open(`note/${type}.html?id=${id}`, '_self');
          });
        });

        // Silme butonları
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            if (confirm('Bu notu silmek istiyor musunuz?')) {
              try {
                await apiRequest(`/notes/${id}`, { method: 'DELETE' });
                loadNotes();
              } catch (error) {
                alert('Silme başarısız: ' + error.message);
              }
            }
          });
        });
      } catch (e) {
        console.error('Notlar yüklenemedi:', e);
        document.getElementById('notesList').innerHTML = '<li>Notlar yüklenemedi</li>';
      }
    }

    async function createNote(type, title) {
      const note = await apiRequest('/notes', {
        method: 'POST',
        body: JSON.stringify({ type, title: title || `Yeni ${type} notu` })
      });
      return note;
    }

    // Tüm notları sil (kilitliler hariç)
    document.getElementById('deleteAllBtn').addEventListener('click', async () => {
      if (confirm('Tüm KİLİTLİ OLMAYAN notları silmek istiyor musunuz? Bu işlem geri alınamaz!')) {
        try {
          const notes = await apiRequest('/notes');
          for (const note of notes) {
            if (!note.locked) {
              await apiRequest(`/notes/${note.id}`, { method: 'DELETE' });
            }
          }
          loadNotes();
        } catch (error) {
          alert('Toplu silme başarısız: ' + error.message);
        }
      }
    });

    // Yeni not butonu
    document.getElementById('newNoteBtn').addEventListener('click', () => {
      document.getElementById('newNoteModal').style.display = 'flex';
    });

    // Sayfa türü seçimi
    document.querySelectorAll('.page-type-option').forEach(option => {
      option.addEventListener('click', async () => {
        const type = option.dataset.type;
        const note = await createNote(type);
        window.open(`note/${type}.html?id=${note.id}`, '_self');
      });
    });

    // Modal dışına tıklanırsa kapat
    document.getElementById('newNoteModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('newNoteModal')) {
        e.target.style.display = 'none';
      }
    });

    // Sayfa yüklendiğinde notları getir
    loadNotes();
  </script>
</body>
</html>
